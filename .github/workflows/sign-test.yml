name: Sign Test

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore and verify
        env:
          KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY }}
          ALIAS: ${{ secrets.ANDROID_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEY_B64" > key.b64
          base64 --decode key.b64 > key.jks
          echo "keystore size: $(stat -c%s key.jks) bytes"
          echo "--- list alias (checks store password + alias) ---"
          keytool -list -v -keystore key.jks -alias "$ALIAS" -storepass "$STORE_PASS" \
            | grep -E "Alias name|Creation date|Valid from|SHA256:"
          echo "--- certreq (checks key password) ---"
          keytool -certreq -alias "$ALIAS" -keystore key.jks \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" -file /tmp/req.csr
          echo "OK: keystore, alias and both passwords are valid"

      - name: Cleanup
        if: always()
        run: rm -f key.jks key.b64 /tmp/req.csr
